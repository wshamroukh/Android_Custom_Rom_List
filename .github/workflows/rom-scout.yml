name: ROM scout
on:
  schedule: [{ cron: "0 3 * * 1" }]   # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      days: { description: "Activity window (days)", default: "60" }
      latest: { description: "Latest Android version (0 = detect)", default: "0" }
permissions:
  contents: write
  pull-requests: write
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: rom-scout-out/cache.json
          key: rom-scout-${{ github.run_id }}
          restore-keys: rom-scout-
      - name: Run scout
        env:
          GITHUB_TOKEN: ${{ secrets.ROM_SCOUT_TOKEN || secrets.GITHUB_TOKEN }}
        run: >
          python3 .github/rom-scout/rom_scout.py --write
          --days "${{ inputs.days || '60' }}" --latest-android "${{ inputs.latest || '0' }}"
      - name: Keep the full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rom-scout-report
          path: |
            rom-scout-out/report.md
            rom-scout-out/README.diff
            rom-scout-out/candidates.json
      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: rom-scout/update
          title: "ROM scout: list update"
          commit-message: "ROM scout: update ROM list"
          body-path: rom-scout-out/pr-body.md
          add-paths: README.md
          delete-branch: true
